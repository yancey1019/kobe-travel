<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>神戶浪漫秋旅 2026</title>
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FAF7F2;
            -webkit-tap-highlight-color: transparent;
        }
        .active-tab {
            color: #BE3144;
            border-bottom: 3px solid #BE3144;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-24 max-w-md mx-auto bg-[#FAF7F2] shadow-2xl min-h-screen relative text-slate-800">

    <!-- 🔒 專屬登入遮罩 -->
    <div id="auth-overlay" class="fixed inset-0 bg-[#0B192C]/90 backdrop-blur-md z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-7 shadow-2xl text-center border border-amber-100">
            <div class="w-14 h-14 bg-gradient-to-tr from-[#BE3144] to-[#F05941] text-white rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-lg shadow-rose-200">
                <i class="fas fa-heart"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800 tracking-wide">神戶浪漫秋旅 🍁</h2>
            <p class="text-xs text-amber-800/60 mt-1 mb-5">2026 慶生之旅 · 雙人專屬登入</p>

            <div class="space-y-3.5 text-left">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 block mb-1">電子郵件</label>
                    <input type="email" id="login-email" placeholder="example@gmail.com" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-rose-400">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 block mb-1">密碼</label>
                    <input type="password" id="login-pass" placeholder="••••••••" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-rose-400">
                </div>
                <p id="login-error" class="text-xs text-rose-500 hidden text-center font-medium leading-relaxed"></p>
                <button type="button" onclick="handleLogin()" class="w-full bg-gradient-to-r from-[#BE3144] to-[#D97706] text-white p-3 rounded-xl font-bold text-sm shadow-md shadow-rose-200 active:scale-98 transition-transform mt-2">驗證身份並登入</button>
            </div>
        </div>
    </div>

    <!-- 頂部 App Bar -->
    <header class="bg-gradient-to-r from-[#0B192C] via-[#1E3E62] to-[#0B192C] text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold tracking-wider flex items-center gap-1.5">
                    <span>神戶浪漫秋旅</span>
                    <span class="text-amber-400 text-sm">🍁</span>
                </h1>
                <p class="text-[11px] text-amber-200/80 font-light">2026.10.18 ~ 10.22 (5天4夜)</p>
            </div>
            <div id="weather-badge" class="bg-white/10 backdrop-blur-md border border-white/15 text-[11px] px-3 py-1 rounded-full flex items-center gap-1.5 text-amber-100">
                <i class="fas fa-sparkles text-amber-300"></i> <span>神戶港灣</span>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main id="main-content" class="p-4">
        <!-- 行程頁面 -->
        <div id="page-schedule" class="page-section">
            <!-- 天數切換鈕 -->
            <div class="flex gap-2 overflow-x-auto pb-3 mb-3 no-scrollbar sticky top-[68px] bg-[#FAF7F2]/95 backdrop-blur-sm py-2 z-40 -mx-4 px-4">
                <button onclick="switchDay(1)" id="day-btn-1" class="day-btn shrink-0 bg-gradient-to-r from-[#BE3144] to-[#D97706] text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-sm">D1 (10/18)</button>
                <button onclick="switchDay(2)" id="day-btn-2" class="day-btn shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold shadow-2xs">D2 (10/19) 🎂</button>
                <button onclick="switchDay(3)" id="day-btn-3" class="day-btn shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold shadow-2xs">D3 (10/20)</button>
                <button onclick="switchDay(4)" id="day-btn-4" class="day-btn shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold shadow-2xs">D4 (10/21)</button>
                <button onclick="switchDay(5)" id="day-btn-5" class="day-btn shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold shadow-2xs">D5 (10/22)</button>
            </div>

            <p class="text-[11px] text-amber-900/60 mb-3 text-center"><i class="fas fa-hand-pointer mr-1 text-amber-600"></i>點擊卡片可編輯內容，含子行程的時間軸清單</p>

            <!-- 行程清單容器 -->
            <div id="schedule-container" class="space-y-3.5"></div>

            <!-- 新增行程卡片 -->
            <div class="bg-white p-4 rounded-2xl border border-dashed border-amber-300/80 shadow-2xs mt-8 mb-4">
                <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-1.5">
                    <span class="w-6 h-6 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-xs"><i class="fas fa-calendar-plus"></i></span>
                    <span>➕ 新增自訂行程卡片</span>
                </h3>
                <div class="grid grid-cols-2 gap-2.5 mb-2.5">
                    <select id="sch-day" class="border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-rose-400 bg-white">
                        <option value="1">第一天 (10/18)</option>
                        <option value="2">第二天 (10/19)🎂</option>
                        <option value="3">第三天 (10/20)</option>
                        <option value="4">第四天 (10/21)</option>
                        <option value="5">第五天 (10/22)</option>
                    </select>
                    <input type="text" id="sch-time" placeholder="時間 (如: 14:00-15:30)" class="border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-rose-400">
                </div>
                <div class="grid grid-cols-2 gap-2.5 mb-2.5">
                    <select id="sch-type" class="border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-rose-400 bg-white">
                        <option value="spot">🎯 景點</option>
                        <option value="restaurant">🍱 餐廳</option>
                        <option value="transport">🚌 交通</option>
                        <option value="hotel">🏨 住宿</option>
                    </select>
                    <input type="text" id="sch-cost" placeholder="費用 (如: 340日幣)" class="border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-rose-400">
                </div>
                <div class="mb-2.5">
                    <input type="text" id="sch-nav" placeholder="Google Maps 導航關鍵字 (選填)" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-rose-400">
                </div>
                <div class="mb-2.5">
                    <input type="text" id="sch-title" placeholder="行程標題" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-rose-400 font-semibold">
                </div>
                <div class="mb-3">
                    <textarea id="sch-desc" rows="2" placeholder="詳細說明、推薦餐點或備忘..." class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-rose-400"></textarea>
                </div>
                <button type="button" onclick="addCustomSchedule()" class="w-full bg-gradient-to-r from-[#BE3144] to-[#D97706] text-white p-2.5 rounded-xl text-xs font-bold shadow-md shadow-rose-200 active:scale-98 transition-transform">推送到雙方手機行程表</button>
            </div>
        </div>

        <!-- 記帳頁面 -->
        <div id="page-ledger" class="page-section hidden">
            <div class="bg-gradient-to-br from-[#0B192C] via-[#1E3E62] to-[#BE3144] text-white p-5 rounded-3xl shadow-xl mb-6 relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 text-white/5 text-8xl"><i class="fas fa-coins"></i></div>
                <p class="text-xs text-amber-200 tracking-wider uppercase font-medium">⚡ 雙人即時同步記帳 (JPY)</p>
                <h2 id="total-expense" class="text-3xl font-extrabold mt-1 tracking-tight text-white">¥0</h2>
                <div class="w-full bg-white/20 h-2 rounded-full mt-4 overflow-hidden">
                    <div id="budget-progress" class="bg-gradient-to-r from-amber-300 to-amber-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-[11px] text-amber-100/80 mt-2">
                    <span>累計總花費</span>
                    <span>基礎交通預備金: ¥7,000</span>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm mb-6">
                <h3 class="text-xs font-bold text-slate-700 mb-3 flex items-center gap-1.5">
                    <span class="w-5 h-5 rounded-md bg-rose-50 text-rose-600 flex items-center justify-center text-[10px]"><i class="fas fa-plus"></i></span>
                    <span>新增一筆開銷</span>
                </h3>
                <div class="grid grid-cols-2 gap-2.5 mb-2.5">
                    <input type="text" id="exp-title" placeholder="項目 (如: 明石燒)" class="border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-rose-400">
                    <input type="number" id="exp-amount" placeholder="金額 (JPY)" class="border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-rose-400 font-bold">
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                    <select id="exp-category" class="border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-rose-400 bg-white">
                        <option value="交通">🚌 交通</option>
                        <option value="美食">🍱 美食</option>
                        <option value="購物">🛍️ 購物</option>
                        <option value="門票">🎟️ 門票/其他</option>
                    </select>
                    <button type="button" onclick="addExpense()" class="bg-gradient-to-r from-[#BE3144] to-[#D97706] text-white rounded-xl text-xs font-bold shadow-md shadow-rose-200 active:scale-95 transition-transform">儲存至雲端</button>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="text-xs font-bold text-slate-500 tracking-wider uppercase mb-1">消費紀錄清單</h3>
                <div id="expense-list" class="space-y-2"></div>
            </div>
        </div>

        <!-- 重要資訊頁面 -->
        <div id="page-info" class="page-section hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-2xs">
                <h3 class="font-bold text-slate-800 border-b border-slate-100 pb-2.5 mb-3 flex items-center gap-2 text-sm">
                    <span class="w-6 h-6 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xs"><i class="fas fa-plane"></i></span>
                    <span>航班時刻資訊 (星宇航空)</span>
                </h3>
                <div class="space-y-2.5 text-xs text-slate-600">
                    <div class="flex justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span><strong>去程 JX834</strong> (10/18 週日)</span>
                        <span class="text-blue-700 font-bold">06:50 桃園 T1 → 10:30 神戶 T2</span>
                    </div>
                    <div class="flex justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span><strong>回程 JX835</strong> (10/22 週四)</span>
                        <span class="text-blue-700 font-bold">11:40 神戶 T2 → 13:40 桃園 T1</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-2xs">
                <h3 class="font-bold text-slate-800 border-b border-slate-100 pb-2.5 mb-3 flex items-center gap-2 text-sm">
